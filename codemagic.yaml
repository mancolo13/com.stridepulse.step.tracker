workflows:
  android-release:
    name: Android Release Workflow
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.stridepulse.step.tracker"
        KEY_ALIAS: "upload"
        KEY_PASSWORD: "DyM5ovu0XORHPH5EaU"
        KEYSTORE_PASSWORD: "DyM5ovu0XORHPH5EaU"
    scripts:
      - name: Set up keystore and signing
        script: |
          echo "Configuring signing properties..."
          echo "storePassword=$KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Flutter analyze
        script: |
          flutter analyze
      - name: Build Android Release AppBundle
        script: |
          flutter build appbundle --release
      - name: Build Android Release APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
